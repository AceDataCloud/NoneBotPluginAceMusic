name: Package
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - run: pip install 'nonebot2[fastapi]' dist/*.whl && python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
